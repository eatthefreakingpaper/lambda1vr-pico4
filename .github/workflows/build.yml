name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and SDK components
        run: |
          echo "y" | sdkmanager --install "ndk;25.1.8937393" "build-tools;29.0.3" "platforms;android-32"

      - name: Build OpenXR loader from source
        run: |
          git clone --depth=1 https://github.com/KhronosGroup/OpenXR-SDK-Source.git /tmp/openxr-src
          cmake -S /tmp/openxr-src -B /tmp/openxr-build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LOADER=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_CONFORMANCE_TESTS=OFF
          cmake --build /tmp/openxr-build --target openxr_loader -j$(nproc)
          cp /tmp/openxr-build/src/loader/libopenxr_loader.so Projects/AndroidPrebuilt/jni/libopenxr_loader.so
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'
          cache-disabled: true

      - name: Build release APK
        working-directory: Projects/Android
        run: |
          rm -rf .cxx
          gradle clean assembleRelease \
            --no-build-cache \
            -Pandroid.ndkVersion=25.1.8937393 \
            -Pandroid.compileSdkVersion=32

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda1vr-pico4
          path: Projects/Android/build/outputs/apk/release/lambda1vr-release.apk
          retention-days: 14
