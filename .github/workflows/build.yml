name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;25.1.8937393" "build-tools;29.0.3" "platforms;android-32"

      - name: Build release APK
        working-directory: Projects/Android
        run: |
          chmod +x ../../gradlew
          ../../gradlew assembleRelease \
            -Pandroid.ndkVersion=25.1.8937393 \
            -Pandroid.compileSdkVersion=32

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda1vr-pico4
          path: Projects/Android/build/outputs/apk/release/lambda1vr-release.apk
          retention-days: 14
